name: 라운지 공지 수집 (live_data.json)

on:
  schedule:
    # 30분마다 (UTC 기준 cron). GitHub 예약 실행은 수 분~수십 분 늦어질 수 있음
    - cron: '7,37 * * * *'
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능
  push:
    paths:
      - 'data/manual.json' # 수동 데이터를 고치면 바로 반영
      - 'scripts/collect-live-data.mjs'

permissions:
  contents: write

concurrency:
  group: collect-live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 라운지 공지·쿠폰 수집
        run: node scripts/collect-live-data.mjs

      - name: 변경 시에만 커밋
        run: |
          if git diff --quiet -- live_data.json && [ -z "$(git ls-files --others --exclude-standard -- live_data.json)" ]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_data.json
          git commit -m "chore: 라운지 공지 데이터 갱신"
          git push
